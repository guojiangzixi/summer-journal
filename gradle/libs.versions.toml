[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.53.1"
composeBom = "2024.12.01"
navigation = "2.8.5"
room = "2.6.1"
datastore = "1.1.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
coroutines = "1.9.0"
serialization = "1.7.3"
retrofit = "2.11.0"
okhttp = "4.12.0"
jsoup = "1.18.3"
# ML Kit 中文文字识别（OCR）
# ★ 必须是 bundled 版（text-recognition-chinese），不能用 GMS 薄壳版：
#   国内荣耀/华为机型大多没有 Google Play 服务，薄壳版会永远停在「正在下载模型」。
#   代价是 APK 增大约 3-4MB（模型随包分发），换来完全离线可用。
mlkitTextRecognitionChinese = "16.0.1"
media3 = "1.5.1"
coil = "3.0.4"
photopicker = "1.8.0"
work = "2.10.0"
playServicesLocation = "21.3.0"
coreKtx = "1.15.0"
splashscreen = "1.0.1"

[libraries]
# —— AndroidX 基础 ——
core-ktx                        = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity-compose                = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
splashscreen                    = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
lifecycle-runtime-ktx           = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose     = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose       = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# —— Compose ——
compose-bom                     = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui                      = { module = "androidx.compose.ui:ui" }
compose-ui-graphics             = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling              = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview      = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3               = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
navigation-compose              = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# —— DI ——
hilt-android                    = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler                   = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose         = { module = "androidx.hilt:hilt-navigation-compose", version = "1.2.0" }
hilt-work                       = { module = "androidx.hilt:hilt-work", version = "1.2.0" }
hilt-compiler-androidx          = { module = "androidx.hilt:hilt-compiler", version = "1.2.0" }

# —— 本地存储 ——
room-runtime                    = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx                        = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler                   = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences           = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# —— 网络 / 序列化 ——
retrofit                        = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization  = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp                          = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging                  = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json      = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# —— 教务导入：HTML 解析 ——
jsoup                           = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# OCR：图片文字识别（手札图片 / 课表截图）
mlkit-text-recognition-chinese  = { module = "com.google.mlkit:text-recognition-chinese", version.ref = "mlkitTextRecognitionChinese" }

# —— 媒体 ——
media3-exoplayer                = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session                  = { module = "androidx.media3:media3-session", version.ref = "media3" }
coil-compose                    = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

# —— 图片选择 ——
# Android 13+ 走系统的 PickVisualMedia（PhotoPicker），不需要任何读取权限；
# 12 及以下用 ACTION_OPEN_DOCUMENT。两者都在 activity-ktx 里，无额外依赖。
photopicker                     = { module = "androidx.activity:activity-ktx", version.ref = "activityCompose" }

# —— 后台 / 定位 ——
work-runtime-ktx                = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
play-services-location          = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

# —— 协程 ——
kotlinx-coroutines-android      = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# —— 测试 ——
# 用 JUnit4：零配置、Android 工具链默认支持。
# 想换 JUnit5 需要额外加 de.mannodermaus.android-junit5 插件，v1.0 不值得。
junit                           = { module = "junit:junit", version = "4.13.2" }
turbine                         = { module = "app.cash.turbine:turbine", version = "1.2.0" }
coroutines-test                 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application     = { id = "com.android.application", version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                    = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
