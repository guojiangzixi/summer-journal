name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 打 tag 时要创建 Release，需要写权限
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 单元测试 + 构建 Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ★ 刻意不用 android-actions/setup-android：
      #   它会去下载新版 cmdline-tools，而其默认 packages 含 `tools` 包 ——
      #   该包在新版 sdkmanager 里已被移除，会直接以 exit code 1 失败。
      #   GitHub 的 ubuntu runner 本来就预装了 Android SDK（含 platform-tools 与已接受的许可），
      #   这里只需补装本项目需要的 platform-35 / build-tools 35.0.0。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "预装 platform: $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
          SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo "可用 platform: $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "可用 build-tools: $(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # 依赖解析失败是最难排查的一类 CI 问题，先把各源的可达性打出来
      - name: 检查依赖源连通性
        run: |
          for u in \
            https://dl.google.com/dl/android/maven2/ \
            https://repo.maven.apache.org/maven2/ \
            https://plugins.gradle.org/m2/ \
            https://services.gradle.org/distributions/ ; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" 2>/dev/null || echo ERR)
            echo "$u -> $code"
          done

      - name: 赋予 gradlew 可执行权限
        run: chmod +x gradlew

      # wrapper 里指向的是腾讯镜像（方便国内本地构建）；
      # runner 在海外，官方发行源更直接。仅改 CI 这次运行，不动仓库里的文件。
      - name: 切换到官方 Gradle 发行源
        run: |
          sed -i 's|mirrors\.cloud\.tencent\.com/gradle/|services.gradle.org/distributions/|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      # 解析器是全项目最容易出错的地方，测试跑不过就不该出包
      - name: 跑单元测试
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SummerJournal-debug.apk
          ls -lh dist/

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SummerJournal-debug
          path: dist/*.apk
          if-no-files-found: error

      # 打 tag（如 v1.3.0）时自动发 Release，APK 作为附件
      - name: 重命名 APK 用于 Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp dist/SummerJournal-debug.apk "dist/SummerJournal-${{ github.ref_name }}-debug.apk"

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SummerJournal-*-debug.apk
          generate_release_notes: true
          draft: false
          prerelease: false
